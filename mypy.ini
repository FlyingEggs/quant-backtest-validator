[mypy]
python_version = 3.9
warn_unused_configs = True
show_error_codes = True
files = validator

# Baseline target: `mypy validator/` must stay clean on THIS configuration
# (CI lint job). Full `--strict` (disallow_untyped_defs / warn_return_any /
# no un-parameterised Any) is the long-term goal and needs report-container
# TypedDicts across the engine - the heterogeneous report dicts currently use
# `Dict[str, Any]` deliberately (see CLAUDE.md: Any only on dynamic structures,
# with a reason). Tracked on the Roadmap, not faked as done.
